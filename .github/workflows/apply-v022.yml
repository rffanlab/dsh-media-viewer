name: Apply v0.2.2 inline-code fix

on:
  push:
    paths:
      - .github/workflows/apply-v022.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch inline code path handling
        shell: python
        run: |
          from pathlib import Path
          import json

          p = Path('client.js')
          s = p.read_text(encoding='utf-8')

          old = '''var clickable = t.closest('button,a,[role="button"],[data-path],[data-file-path],[data-filename],[data-file],[data-uri],[data-url],[tabindex]')'''
          new = '''var clickable = t.closest('button,a,code,[role="button"],[data-path],[data-file-path],[data-filename],[data-file],[data-uri],[data-url],[tabindex]')'''
          if old not in s:
              raise SystemExit('click selector anchor not found')
          s = s.replace(old, new, 1)

          css_anchor = "'.mv-page{height:100%;min-height:480px;display:flex;flex-direction:column;overflow:hidden}.mv-page-title{padding:12px 16px;font-weight:600;border-bottom:1px solid var(--dsw-alias-border-l1,#d0d7de)}'"
          css_new = "'.mv-page{height:100%;min-height:480px;display:flex;flex-direction:column;overflow:hidden}.mv-page-title{padding:12px 16px;font-weight:600;border-bottom:1px solid var(--dsw-alias-border-l1,#d0d7de)}' +\n      '.mv-chat-file-code{cursor:pointer!important;text-decoration:underline dotted;text-underline-offset:2px}'"
          if css_anchor not in s:
              raise SystemExit('css anchor not found')
          s = s.replace(css_anchor, css_new, 1)

          click_anchor = '''    function onClickCapture(e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return
      var t = e.target; if (!t || typeof t.closest !== 'function') return
      if (t.closest('.mv-panel') || t.closest('.mv-page')) return
      var clickable = t.closest('button,a,code,[role="button"],[data-path],[data-file-path],[data-filename],[data-file],[data-uri],[data-url],[tabindex]')
      if (!clickable) return
      var path = pathOfElement(clickable); if (!path) return
      e.preventDefault(); e.stopPropagation(); requestOpenPath(path)
    }
'''
          hover_block = '''    function onClickCapture(e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return
      var t = e.target; if (!t || typeof t.closest !== 'function') return
      if (t.closest('.mv-panel') || t.closest('.mv-page')) return
      var clickable = t.closest('button,a,code,[role="button"],[data-path],[data-file-path],[data-filename],[data-file],[data-uri],[data-url],[tabindex]')
      if (!clickable) return
      var path = pathOfElement(clickable); if (!path) return
      e.preventDefault(); e.stopPropagation(); requestOpenPath(path)
    }
    function onPointerOverCapture(e) {
      var t = e.target; if (!t || typeof t.closest !== 'function') return
      if (t.closest('.mv-panel') || t.closest('.mv-page')) return
      var code = t.closest('code')
      if (!code) return
      var path = cleanCandidate(code.textContent || '')
      if (!path) return
      try {
        code.classList.add('mv-chat-file-code')
        code.setAttribute('title', '点击用媒体查看器打开：' + path)
      } catch (err) {}
    }
'''
          if click_anchor not in s:
              raise SystemExit('click handler anchor not found')
          s = s.replace(click_anchor, hover_block, 1)

          apply_old = '''      var disposeClick = null
      try { document.addEventListener('click', onClickCapture, true); disposeClick = function () { document.removeEventListener('click', onClickCapture, true) } } catch (e) {}'''
          apply_new = '''      var disposeClick = null
      var disposeHover = null
      try {
        document.addEventListener('click', onClickCapture, true)
        document.addEventListener('pointerover', onPointerOverCapture, true)
        disposeClick = function () { document.removeEventListener('click', onClickCapture, true) }
        disposeHover = function () { document.removeEventListener('pointerover', onPointerOverCapture, true) }
      } catch (e) {}'''
          if apply_old not in s:
              raise SystemExit('listener anchor not found')
          s = s.replace(apply_old, apply_new, 1)

          ret_old = '''      return function () { if (disposeClick) disposeClick() }'''
          ret_new = '''      return function () { if (disposeClick) disposeClick(); if (disposeHover) disposeHover() }'''
          if ret_old not in s:
              raise SystemExit('cleanup anchor not found')
          s = s.replace(ret_old, ret_new, 1)

          p.write_text(s, encoding='utf-8')

          pkgp = Path('package.json')
          pkg = json.loads(pkgp.read_text(encoding='utf-8'))
          pkg['version'] = '0.2.2'
          pkgp.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Syntax check
        run: node --check client.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client.js package.json
          git commit -m "fix: open inline code file paths from chat"
          git push
