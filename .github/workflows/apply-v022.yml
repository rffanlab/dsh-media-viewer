name: Apply v0.2.2 inline-code fix

on:
  push:
    paths:
      - .github/workflows/apply-v022.yml
      - scripts/apply-v022.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply-v022.py
      - name: Syntax check
        run: node --check client.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client.js package.json
          git commit -m "fix: open inline code file paths from chat"
          git push
